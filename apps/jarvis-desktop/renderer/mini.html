<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Быстрый чат Nox</title>
  <link rel="stylesheet" href="themes.css">
  <link rel="stylesheet" href="mini.css">
  <script src="theme-boot.js"></script>
  <script src="shared.js" defer></script>
  <script src="orb-nox.js" defer></script>
  <script src="mini.js" defer></script>
</head>
<body>
  <main class="quick" aria-label="Быстрый чат">
    <header><strong>Nox</strong><span>Быстрый чат</span><button type="button" id="miniHide" aria-label="Скрыть">×</button></header>
    <div class="quick-pet" aria-hidden="true"><canvas id="quickCore"></canvas></div>
    <form id="quickForm">
      <label class="sr" for="quickInput">Сообщение Джарвису</label>
      <textarea id="quickInput" rows="2" placeholder="Что нужно сделать?"></textarea>
      <div class="actions"><button type="button" id="quickMic" aria-label="Диктовка">Микрофон</button><span>Enter — отправить · Shift+Enter — новая строка</span><button class="primary" id="quickSend" type="submit">Отправить</button></div>
      <section id="quickWork" aria-live="polite" hidden>
        <div class="work-head"><span id="quickStep"></span><span id="quickStatus">Думаю</span><button id="miniStop" type="button">Стоп</button></div>
        <p id="quickReply"></p><button type="button" id="miniExpand">Открыть в Nox</button>
      </section>
    </form>
    <section id="miniApproval" aria-labelledby="approvalTitle" hidden>
      <div class="approval-head"><strong id="approvalTitle">Нужно ваше разрешение</strong><span id="approvalTime"></span></div>
      <p id="approvalAction"></p><p id="approvalReason"></p><pre id="approvalArgs" tabindex="0"></pre>
      <p id="approvalError" role="alert"></p>
      <div class="approval-actions"><button id="approvalReject" type="button">Отклонить</button><button id="approvalAllow" type="button" class="primary" disabled>Разрешить</button></div>
      <button id="approvalNext" type="button" hidden>Показать следующий запрос</button>
    </section>
    <p id="quickError" role="alert"></p>
  </main>
</body>
</html>
