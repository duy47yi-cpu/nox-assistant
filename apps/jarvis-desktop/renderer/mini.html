<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="color-scheme" content="dark">
  <title>Джарвис · мини</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="themes.css">
  <script src="theme-boot.js"></script>
  <!-- Мини-режим: только шар, строка статуса и последнее действие. Окно без рамки, поверх остальных. -->
  <script src="shared.js" defer></script>
  <script src="orb.js" defer></script>
  <script src="mini.js" defer></script>
</head>
<body class="mini-body">
  <div class="mini">
    <div class="mini-top">
      <span class="mini-brand"><span class="brand-mark" data-icon="logo" aria-hidden="true"></span>Джарвис</span>
      <span class="mini-top-btns">
        <button class="icon-btn icon-btn-sm" type="button" id="miniStop" title="Остановить" aria-label="Остановить" hidden><span data-icon="stop"></span></button>
        <button class="icon-btn icon-btn-sm" type="button" id="miniExpand" title="Развернуть в полное окно" aria-label="Развернуть"><span data-icon="expand"></span></button>
      </span>
    </div>
    <div class="mini-orb"><canvas class="orb-canvas" id="miniOrb" aria-hidden="true"></canvas></div>
    <p class="mini-status" id="miniStatus" data-state="idle" aria-live="polite">Готов</p>
    <p class="mini-last" id="miniLast" hidden><span class="mini-last-text" id="miniLastText"></span></p>
    <div class="mini-approval" id="miniApproval" hidden>
      <button class="btn btn-primary" type="button" data-decision="once">Разрешить</button>
      <button class="btn btn-danger-ghost" type="button" data-decision="reject">Отказать</button>
    </div>
  </div>
</body>
</html>
