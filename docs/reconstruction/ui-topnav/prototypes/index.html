<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nox — прототип навигации</title><link rel="stylesheet" href="style.css"></head><body><header class="top"><div class="brand"><span class="mark">✳</span> NOX</div><nav class="tabs" aria-label="Основная навигация"></nav><div class="tools"><button id="settings" title="Настройки" aria-label="Настройки">⚙</button><button id="profile" title="Профиль" aria-label="Профиль"><span class="avatar">А</span></button><span class="sep"></span><button class="win" title="Свернуть">−</button><button class="win" title="Развернуть">□</button><button class="win close" title="Закрыть">×</button></div></header><div class="layout"><nav class="rail" aria-label="Основная навигация"></nav><aside class="history" id="history"><div class="history-head"><b>История</b><button id="collapse" aria-label="Свернуть историю" title="Свернуть историю">◧</button></div><button id="new" class="new">＋ <span>Новый чат</span></button><label class="search">⌕ <input id="search" placeholder="Поиск по истории" aria-label="Поиск по истории"></label><div class="history-list"><div class="group">СЕГОДНЯ</div><button class="conversation active">Новый разговор</button><button class="conversation">Идеи для Nox Assistant</button><div class="group">РАНЕЕ</div><button class="conversation">План на неделю</button><button class="conversation">Работа с файлами</button></div><div class="empty" hidden>Ничего не найдено</div></aside><main class="main"><div class="chat-head"><button id="expand" title="История" aria-label="Открыть историю">☰</button><div><strong id="title">Новый разговор</strong><small id="subtitle">Личное пространство</small></div></div><div class="content"><section class="chat"><div class="messages" id="messages"><div class="greeting"><div class="eyebrow">NOX ASSISTANT</div><h1>Привет, Абу.</h1><p>Чем займёмся сегодня?</p></div></div><form class="composer" id="form"><textarea rows="2" p
